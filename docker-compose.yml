name: texto-contador-app

services:
  backend:
    build: ./backend
    container_name: texto-contador-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8000"
    environment:
      FIRESTORE_PROJECT_ID: "openclawbotvic"
      FIRESTORE_COLLECTION: "texto-contador-app"
      KAISER_WEBHOOK_TOKEN: ""

  frontend:
    build: ./frontend
    container_name: texto-contador-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:80"
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend
